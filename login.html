<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="/assets/base.css">
    <link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
    <main>
        <section class="login-page flex align-center justify-center">
            <form action="" id="login-page" class="login-form" method="post">
                <h1 class="text-center">Login</h1>
                <div class="form-group">
                    <label for="username" class="form-control-label">Username</label>
                    <br>
                    <input class="form-control" type="text" name="username" id="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-control-label">Password</label>
                    <br>
                    <input class="form-control" type="text" name="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="flex align-center justify-center">
                    <button type="submit" class="btn btn-back">Back to Home</button>
                    <button type="reset" class="btn btn-login">Login</button>
                </div>
                <a href="/forgot-password.html">Forgot password?</a>
                <a href="/register.html">Don't have an account? Register</a>
            </form>
        </section>
    </main>
</body>
</html>
