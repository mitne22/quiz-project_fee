<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/auth-bootstrap.css" />
</head>

<body class="auth-bg m-0">
    <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
        <section class="row w-100 justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-5">
                <form id="register-page" class="card border-0 shadow rounded-3 p-4 p-md-5" method="post" action="">
                    <h1 class="h3 fw-bold text-center mb-4">Register</h1>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="first-name" class="form-label">Firstname</label>
                            <input type="text" class="form-control" id="first-name" name="firstName"
                                placeholder="Enter your firstname" required />
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="last-name" class="form-label">Lastname</label>
                            <input type="text" class="form-control" id="last-name" name="lastName"
                                placeholder="Enter your lastname" required />
                        </div>
                    </div>

                    <div class="mt-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email"
                            required />
                    </div>

                    <div class="row g-3 mt-1">
                        <div class="col-12 col-md-6">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="Enter your username" required />
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="phone" class="form-label">Phone number</label>
                            <input type="text" class="form-control" id="phone" name="phone"
                                placeholder="Enter your phone number" />
                        </div>
                    </div>

                    <div class="mt-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Enter your password" required />
                    </div>

                    <div class="mt-3">
                        <label for="confirm-password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm-password" name="confirmPassword"
                            placeholder="Confirm your password" required />
                    </div>

                    <div class="row g-2 mt-4 mb-2">
                        <div class="col-6">
                            <a href="/home.html" class="btn w-100">Back to Home</a>
                        </div>
                        <div class="col-6">
                            <button type="submit" class="btn btn-primary w-100 border-0">Register</button>
                        </div>
                    </div>

                    <a href="/login.html" class="d-block text-center text-decoration-none link-dark mt-2">
                        Already have an account? Login
                    </a>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
