<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/auth-bootstrap.css" />
</head>

<body class="auth-bg m-0">
    <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
        <section class="row w-100 justify-content-center">
            <div class="col-11 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <form id="login-page" class="card border-0 shadow rounded-3 p-4 p-md-5" method="post" action="">
                    <h1 class="h3 fw-bold text-center mb-4">Login</h1>

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="Enter your username" required />
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Enter your password" required />
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <a href="/home.html" class="btn w-100">Back to Home</a>
                        </div>
                        <div class="col-6">
                            <button type="submit" class="btn btn-primary w-100 border-0">Login</button>
                        </div>
                    </div>

                    <a href="/forgot-password.html" class="d-block text-center text-decoration-none link-dark">Forgot
                        password?</a>
                    <a href="/register.html" class="d-block text-center text-decoration-none link-dark mt-2">
                        Don't have an account? Register
                    </a>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
