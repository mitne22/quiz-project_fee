<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register page</title>
    <link rel="stylesheet" href="/assets/base.css">
    <link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
    <main>
        <section class="register-page flex align-center justify-center">
            <form action="" id="register-page" class="register-form" method="post">
                <h1 class="text-center">Register</h1>
                <div class="flex justify-between">
                    <div class="form-group">
                        <label for="fisrt-name" class="form-control-label">Firstname</label>
                        <input type="text" name="firstName" id="first-name" class="form-control" placeholder="Enter your firstname">
                    </div>
                    <div class="form-group">
                        <label for="last-name" class="form-control-label">Lastname</label>
                        <input type="text" name="lastName" id="last-name" class="form-control" placeholder="Enter your lastname">
                    </div>
                </div>
                <div class="form-group">
                    <label for="email" class="form-control-label">Email Address</label>
                    <br>
                    <input class="form-control" type="email" name="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="flex justify-between">
                    <div class="form-group">
                        <label for="username" class="form-control-label">Username</label>
                        <input type="text" name="firstName" id="first-name" class="form-control" placeholder="Enter your username">
                    </div>
                    <div class="form-group">
                        <label for="phone" class="form-control-label">Phone number</label>
                        <input type="text" name="lastName" id="last-name" class="form-control" placeholder="Enter your phone number">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password" class="form-control-label">Password</label>
                    <br>
                    <input class="form-control" type="password" name="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password" class="form-control-label">Confirm Password</label>
                    <br>
                    <input class="form-control" type="password" name="confirm-password" id="confirm-password" placeholder="Confirm your password" required>
                </div>
                <div class="flex align-center justify-center">
                    <button type="submit" class="btn btn-back">Back to Home</button>
                    <button type="reset" class="btn btn-register">Register</button>
                </div>
                <a href="/login.html">Already have an account? Login</a>
            </form>
        </section>
    </main>
</body>
</html>
